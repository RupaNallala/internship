<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
        width: 100%;
        height: 100vh;
        background-color: green;
    }
    .block1{
        width: 100%;
        height: 30vh;
        background-color: aquamarine;
        display:flex;
    }
    .block1 .box1{
    width: 30%;
    height: 30vh;
    background-color:red;
}
    .block1 .box2{
    width: 35%;
    height: 30vh;
    background-color:rgb(52, 9, 180);
}
   .block1 .box3{
    width: 35%;
    height: 30vh;
    background-color:rgb(18, 204, 188);
}

          .block2{
        width: 100%;
        height: 40vh;
        background-color: rgb(137, 11, 175);
        display: flex;
    }
         .block2 .box1{
    width: 60%;
    height: 40vh;
    background-color:rgb(15, 219, 77);
}
    .block2 .box2{
    width: 40%;
    height: 40vh;
    background-color:rgb(185, 42, 6);
} 
    .block2 .box2 .part1{
        width: 100%;
        height: 15vh;
        background-color: rgb(255, 204, 0);
}
   .block2 .box2 .part2{
        width: 100%;
        height: 15vh;
        background-color: rgb(0, 255, 30);
}
   .block2 .box2 .part3{
        width: 100%;
        height: 10vh;
        background-color: rgb(13, 174, 115);
}
.block3{
    width:100% ;
    height:30vh ;
    background-color: antiquewhite;
}
   .block3 .box1{
    width: 40%;
    height: 30vh;
    background-color:plum;
}
    .block3 .box2{
    width: 60%;
    height: 30vh;
    background-color:rgb(52, 20, 159)
}

    </style>
</head>
<body>
        <div class="container">
        <div class="block1">
            <div class="box1">1</div>
            <div class="box2">2</div>
            <div class="box3">3</div>
        </div>
        <div class="block2">
            <div class="box1">1</div>
            <div class="box2">
                <div class="part1">1</div>
                <div class="part2">2</div>
                <div class="part3">3</div>
            </div>
        </div>
        <div class="block3">
            <div class="box1">1</div>
            <div class="box2">2</div>
        </div>
     </div>
</body>
</html>
