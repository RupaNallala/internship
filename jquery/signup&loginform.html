<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Sign Up</title>

     
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>      


    <style>

        

        body {
            background:linear-gradient(135deg, #df70e9, #764ba2);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


         
        .box {
            width: 400px;

            background: rgba(255, 255, 255, 0.95);

            padding: 30px;

            margin-top:100px;

            height:415px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }


         

        h2 {
            text-align: center;

            margin-bottom: 25px;

            font-weight: bold;
        }


         

        .signup {
            display: none;
            
            

        }


         
      .link {
            color: #6a11cb;

            font-weight: bold;

            cursor: pointer;
        }

    </style>

</head>


<body>


    <div class="box">


         

        <div class="login" id="loginPanel">

            <h2>Login</h2>


            <form id="loginForm">


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-primary w-100">

                    Login

                </button>


            </form>


            <p class="text-center mt-3">

                Don't have an account?

                <span class="link" id="signupToggle">
                    Sign Up
                </span>

            </p>

        </div>



         

        <div class="signup" id="signupPanel">

            <h2>Sign Up</h2>


                <form id="signupForm">


                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter your name"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           placeholder="Create password"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-success w-100">

                    Create Account

                </button>


            </form>


            <p class="text-center">

                Already have an account?

                <span class="link" id="loginToggle">
                    Login
                </span>

            </p>

        </div>


    </div>

 <script>

        $(document).ready(function() {
     
            $("#signupToggle").click(function() {

                $("#loginPanel").hide();

                $("#signupPanel").show();

            });


            

            $("#loginToggle").click(function() {

                $("#loginPanel").show();

                $("#signupPanel").hide();

            });


             

            $("#loginForm").submit(function(event) {

                 alert("Login Successful!");

            });


            

            $("#signupForm").submit(function(event) {

                alert("Account Created Successfully!");

            });


        });

    </script>


</body>

</html>
