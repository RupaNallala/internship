<!DOCTYPE html>
<html>
<head>
<title>Employee Bonus</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(to right,#4facfe,#00f2fe);
}

.container{
    width:350px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px gray;
    text-align:center;
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid gray;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:10px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

#result{
    margin-top:20px;
    font-weight:bold;
    color:green;
}
</style>

</head>

<body>

<div class="container">

<h2>Employee Bonus</h2>

<input type="text" id="name" placeholder="Employee Name">

<input type="number" id="salary" placeholder="Salary">

<button onclick="bonus()">Calculate Bonus</button>

<p id="result"></p>

</div>

<script>

function bonus(){

let name=document.getElementById("name").value;
let salary=parseFloat(document.getElementById("salary").value);

if(name=="" || isNaN(salary)){
    alert("Please fill all fields");
    return;
}

let bonus;

if(salary>=50000){
    bonus=salary*20/100;
}
else if(salary>=30000){
    bonus=salary*10/100;
}
else{
    bonus=salary*5/100;
}

document.getElementById("result").innerHTML=
"Employee : "+name+"<br>"+
"Salary : ₹"+salary+"<br>"+
"Bonus : ₹"+bonus;

}

</script>

</body>
</html>
