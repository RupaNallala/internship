<!DOCTYPE html>
<html>
<head>
<title>Hotel Room Booking</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(to right,#ff9a9e,#fad0c4);
}
.container{
    width:350px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px gray;
    text-align:center;
}
h2{
    margin-bottom:20px;
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid gray;
    border-radius:5px;
    font-size:16px;
}
button{
    width:100%;
    padding:10px;
    background:#ff4081;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#d81b60;
}
#result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:green;
}
</style>

</head>

<body>

<div class="container">

<h2>Hotel Room Booking</h2>

<input type="text" id="name" placeholder="Customer Name">

<input type="number" id="days" placeholder="Number of Days">

<button onclick="booking()">Book Room</button>

<p id="result"></p>

</div>

<script>

function booking(){

let name=document.getElementById("name").value;
let days=parseInt(document.getElementById("days").value);

if(name=="" || isNaN(days)){
    alert("Please fill all fields");
    return;
}

let discount;

if(days>=7){
    discount="20% Discount";
}
else if(days>=3){
    discount="10% Discount";
}
else{
    discount="No Discount";
}

document.getElementById("result").innerHTML=
"Customer : "+name+"<br>"+
"Days : "+days+"<br>"+
"Offer : "+discount;

}

</script>

</body>
</html>
